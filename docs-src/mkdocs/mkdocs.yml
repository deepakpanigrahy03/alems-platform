# mkdocs.yml
site_name: A-LEMS Documentation
site_description: Agentic LLM Energy Measurement System
site_author: A-LEMS Research
repo_url: https://github.com/deepakpanigrahy03/alems-platform
site_url: https://deepakpanigrahy03.github.io/alems-platform/

docs_dir: source
site_dir: ../../docs/generated/mkdocs

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.highlight
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

nav:
  - Home: index.md

  - Getting Started:
    - Installation: getting-started/installation.md
    - API Keys: getting-started/api-keys.md
    - Quick Start: getting-started/quick-start.md
    - New Machine: getting-started/new-machine.md
    - Troubleshooting: getting-started/troubleshooting.md

  - Concepts:
    - Platform Detection: concepts/platform-detection.md
    - Measurement Model: concepts/measurement-model.md
    - Energy Tiers: concepts/energy-tiers.md
    - Configuration System: concepts/config-system.md
    - Data Flow: concepts/data-flow.md

  - Developer:
    - Architecture: developer/architecture.md
    - Database Schema: developer/database-schema.md
    - Schema Migration: developer/schema-migration.md
    - Energy Chain: developer/energy-chain.md
    - Adding a Platform: developer/adding-a-platform.md
    - Adding a Reader: developer/adding-a-reader.md
    - Adding a Provider: developer/adding-a-provider.md
    - Adding a Model: developer/adding-a-model.md
    - Adding a Task: developer/adding-a-task.md
    - Model Factory: developer/model-factory.md
    - Configuration Hierarchy: developer/config-hierarchy.md
    - kperf PMU: developer/kperf-pmu.md
    - Retry Study Design: developer/retry-study.md
    - Engineering Standards: developer/engineering-standards.md
    - Developer Tools: developer/developer-tools.md

  - Research:
    - Measurement Methodology: research/measurement-methodology.md
    - Orchestration Tax: research/orchestration-tax.md
    - Mathematical Derivations: research/mathematical-derivations.md
    - Energy Attribution: research/energy-attribution.md
    - Phase Attribution: research/phase-attribution.md
    - Energy Readers: research/energy-readers.md
    - System Measurement: research/system-measurement.md
    - Derived Metrics: research/derived-metrics.md
    - Normalization: research/normalization.md
    - Measurement Boundary: research/measurement-boundary.md
    - Provenance: research/provenance.md
    - Run Quality: research/run-quality.md
    - Experiment Classification: research/experiment-classification.md
    - Goal Execution: research/goal-execution.md
    - Output Quality: research/output-quality.md
    - Tool Failure: research/tool-failure.md
    - Tool Instrumentation: research/tool-instrumentation.md
    - Retry Methodology: research/retry-methodology.md
    - Network Energy: research/network-energy.md
    - GPU Energy: research/gpu-energy.md
    - Power Rail Schema: research/power-rail-schema.md
    - Unified Energy Schema: research/unified-energy-schema.md
    - CPU Idle States: research/cpu-idle-states.md
    - Cooling Subsystem: research/cooling-subsystem.md
    - ARM PMU Metrics: research/arm-pmu-metrics.md
    - Outlier Detection: research/outlier-detection.md
    - LLM Wait Energy: research/llm-wait-energy.md
    - Publications: research/publications.md

  - Reference:
    - Platform Matrix: reference/platform-matrix.md
    - Provider Registry: reference/provider-registry.md
    - Task Registry: reference/task-registry.md
    - CLI Reference: reference/cli-reference.md
    - DB Path Resolution: reference/db-path-resolution.md
    - Provider Debugging: reference/provider-debugging.md
    - Data Dictionary: reference/data-dictionary.md
    - API Reference: reference/api.md
    - Orchestration API: reference/orchestration-api.md

  - Guides:
    - Researcher Journey: guides/researcher-journey.md
    - Administrator Guide: guides/administrator-guide.md
    - Contributor Guide: guides/contributor-guide.md

  - Contributing:
    - Adding Documentation: contributing/adding-documentation.md

markdown_extensions:
  - admonition
  - attr_list
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.details
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
