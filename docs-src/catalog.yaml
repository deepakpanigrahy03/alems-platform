# =============================================================================
# A-LEMS Documentation Catalog
# =============================================================================
# Single source of truth: maps every topic to exactly one documentation file.
# Every agent reads this before writing or editing any documentation.
# Every build validates this catalog for staleness.
#
# Fields:
#   topic         — what this doc covers (used for search and agent routing)
#   file          — path relative to docs-src/mkdocs/source/
#   audience      — user, developer, researcher, administrator
#   status        — current | draft | stale
#   last_validated — YYYY-MM-DD (date content was verified against codebase)
#   nav_entry     — exact string from mkdocs.yml nav
# =============================================================================

