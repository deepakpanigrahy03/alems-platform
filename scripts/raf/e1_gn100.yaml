# RAF E1 configuration, GN100, Qwen3 30B A3B Instruct 2507 FP8 (MASTER_PLAN_RAF; SPEC_RAF_LH_02).
# Same format as pilot_gn100.yaml. Read by scripts/raf/pilot_driver.py and pilot_schedule.py.
# Tasks: 30 of 58 stable tasks (3 of 3 checker pass, identical call counts), seed 20261015;
# the other 28 are held out for E3 (raf_e1/e3_heldout_tasks.txt).
# Late ordinal = round(0.7 x calls of that type), clamped to [3, calls-1]; counts from sweep run 1.
pilot: raf_e1
platform: gn100
expected_store_suffix: raf-mlsys-2027/experiments.db

seeds:
  block_order: 20261016
  policy_order: 20261017
  model_seed: 0

policies: [FR_cold, FR_warm, SR_cold, SR_warm]   # RB added as batch E1b when R2 lands
b0_repetitions: 3

classes:
  rate_limit: llm
  json_parse: llm
  tool_error: tool
  timeout: tool

points: [early, late]
early_ordinal: 2

tasks:
  bfcl_multi_turn_base_64:  {stratum: short,  late: {llm: 6, tool: 4}}   # 8 llm, 6 tool
