formula: >
  f_weighted = sum(f_i * r_{i+1}) / sum(r_j for j=0..N)
  where f_i is DVFS state frequency in MHz, r_j is IOReport residency
  in nanoseconds for state j, r_0 is IDLE residency, N is number of
  active DVFS states for the primary compute cluster.
parameters:
  f_i: "DVFS state frequency in MHz from IORegistry voltage-states blob"
  r_j: "IOReport residency nanoseconds for state j (r_0 = IDLE)"
  N: "Number of active DVFS states for the primary compute cluster"
