# config/schema/table_ownership.yaml
# Table ownership map for A-LEMS chunk 39 (SPEC_39_1 section 6).
# Authority: DESIGN_CHUNK39_v3.md D5.1, D5.2, D5.3.
#
# Fields per entry:
#   owner:       core | <namespace>  (namespace names match extension_registry.name)
#   kind:        table | view
#   evidence:    how ownership was determined
#   golden_class:
#     raw:       written once by readers/ingestion; checked by row count and content hash
#     derived:   recomputed by ETL; replayed and diffed exactly
#     config:    seeded or registry data; checked by whole-table hash
#     gui:       GUI configuration; checked by whole-table hash
#     meta:      schema/migration bookkeeping; checked by whole-table hash
#   natural_key: columns that uniquely identify a row without the autoincrement id
#   run_linkage: column path from this table to a run/goal/attempt/experiment, or none
#
# 86 tables, 35 views.  Coverage enforced by golden check (SPEC_39_1 section 7.2a rule 3).

