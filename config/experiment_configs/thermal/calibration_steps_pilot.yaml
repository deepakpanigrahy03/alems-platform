# config/experiment_configs/thermal/calibration_steps_pilot.yaml
study:
  name: "Calibration steps pilot"
  experiment_type: "normal"
  experiment_goal: "session runner pilot: hold a load, rest, repeat"
  experiment_notes: "Pilot of the session runner on the GB10 class (plumbing check, not a scientific result). The load task is a short task for the pilot; a real calibration uses one long task per step."
tasks:
  - id: tg_single_calc
providers:
  - name: vllm_local
    model_id: Mistral-7B-Instruct-v0.3
execution:
  repetitions: 1
  cool_down_seconds: 30
  save_db: true
retry_policy:
  name: "no_retry"
  max_retries: 0
  retry_on_timeout: false
  retry_on_tool_error: false
  retry_on_api_error: false
  retry_on_wrong_answer: false
  backoff_seconds: 0.0
failure_injection:
  enabled: false
quality:
  enabled: false
recording:
  enabled: true
  pre_window_s: 120
  cooldown_max_s: 600
session_plan:
  plugin: calibration_steps
  params:
    load_task: tg_single_calc
    workflow: linear
    channel: gpu
    level: 1.0
    hold_s: 20
    rest_s: 60
    repeats: 2
