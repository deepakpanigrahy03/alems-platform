# config/experiment_configs/thermal/fixed_pause_pilot.yaml
study:
  name: "Fixed pause pilot"
  experiment_type: "normal"
  experiment_goal: "session runner pilot: pause = gap_factor x tau"
  experiment_notes: "Pilot of the session runner on the GB10 class (plumbing check, not a scientific result). tau_s is a scheduling value for the pilot only, not a measured time constant."
tasks:
  - id: tg_single_calc
providers:
  - name: vllm_local
    model_id: Mistral-7B-Instruct-v0.3
execution:
  repetitions: 1
  cool_down_seconds: 30
  save_db: true
retry_policy:
  name: "no_retry"
  max_retries: 0
  retry_on_timeout: false
  retry_on_tool_error: false
  retry_on_api_error: false
  retry_on_wrong_answer: false
  backoff_seconds: 0.0
failure_injection:
  enabled: false
quality:
  enabled: false
recording:
  enabled: true
  pre_window_s: 120
  cooldown_max_s: 600
session_plan:
  plugin: fixed_pause
  params:
    goals: [tg_single_calc]
    workflows: [linear, agentic]
    repeats: 1
    seed: 42
    gap_factor: 1.0
    tau_s: 30
    tau_status: PILOT_ONLY
    tau_source: "pilot scheduling value (decision 2026-11-25); not a measured time constant"
