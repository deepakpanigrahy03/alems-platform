# config/experiment_configs/thermal/back_to_back_pilot.yaml
study:
  name: "Back-to-back pilot"
  experiment_type: "normal"
  experiment_goal: "session runner pilot: goals one after another"
  experiment_notes: "Pilot of the session runner on the GB10 class (plumbing check, not a scientific result). "
tasks:
  - id: tg_single_calc
providers:
  - name: vllm_local
    model_id: Mistral-7B-Instruct-v0.3
execution:
  repetitions: 1
  cool_down_seconds: 30
  save_db: true
retry_policy:
  name: "no_retry"
  max_retries: 0
  retry_on_timeout: false
  retry_on_tool_error: false
  retry_on_api_error: false
  retry_on_wrong_answer: false
  backoff_seconds: 0.0
failure_injection:
  enabled: false
quality:
  enabled: false
recording:
  enabled: true
  pre_window_s: 120
  cooldown_max_s: 600
session_plan:
  plugin: back_to_back
  params:
    goals: [tg_single_calc]
    workflows: [linear, agentic]
    repeats: 1
    seed: 42
