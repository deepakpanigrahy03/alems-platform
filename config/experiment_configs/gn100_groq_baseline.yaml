study:
  name: "GN100 Groq Baseline Study"
  experiment_type: "normal"
  experiment_goal: "Paper2 GPU+network baseline — CPU+GPU+network energy per goal, groq remote, GN100 GB10"
  experiment_notes: "paper2_gn100 group. GPU via DCGM. Network via spbm_fraction_v1. 30 reps."
  workflow_modes: ["linear", "agentic"]
  group_id: "paper2_gn100"
tasks:
  - id: gsm8k_basic
  - id: gsm8k_multi_step
  - id: logical_reasoning
  - id: factual_qa
  - id: science_qa
  - id: commonsense_reasoning
  - id: tg_single_db
  - id: tg_sequential_2
  - id: tg_sequential_3
providers:
  - name: groq
    model_id: llama-3.3-70b-versatile
execution:
  repetitions: 30
  cool_down_seconds: 30
  inter_task_cooldown_seconds: 90
  save_db: true
retry_policy:
  name: "no_retry"
  max_retries: 0
  retry_on_timeout: false
  retry_on_tool_error: false
  retry_on_api_error: false
  retry_on_wrong_answer: false
  backoff_seconds: 0.0
failure_injection:
  enabled: false
quality:
  enabled: false
