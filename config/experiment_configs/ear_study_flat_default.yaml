# config/experiment_configs/ear_study_flat_default.yaml
# =============================================================================
# EAR study: flat_default policy baseline
# Policy: flat retry — no energy awareness, always retries retryable types
# Use: run first to build failure_cost_profile for calibrating ear_v1
# After run: python scripts/etl/failure_cost_profile_etl.py --group <group_id>
# =============================================================================
study:
  name: "EAR Study: flat_default baseline"
  experiment_type: "failure_injection"
  experiment_goal: "Flat retry baseline for EAR policy comparison"
  workflow_modes: ["agentic"]

tasks:
  - id: gsm8k_basic
  - id: logical_reasoning
  - id: tg_sequential_2

providers:
  - name: vllm_remote
    model_id: Mistral-7B-Instruct-v0.3

execution:
  repetitions: 30
  cool_down_seconds: 5
  save_db: true

retry_policy:
  engine: flat
  name: "flat_default"
  max_retries: 3
  retry_on_tool_error: true
  retry_on_api_error: true
  backoff_seconds: 1.0

failure_injection:
  enabled: true
  mode: controlled_retry
  target_goal_pct: 0.40
  per_goal_attempts: 2

quality:
  enabled: false
