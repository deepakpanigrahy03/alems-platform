study:
  name: "GN100 vLLM Condition A — no failure baseline"
  experiment_type: "failure_injection"
  experiment_goal: "Condition A — no failure baseline, vllm_local, GN100 GB10"
  experiment_notes: "10 reps, no failure injection. Clean baseline for retry amplification study."
  workflow_modes: ["agentic", "linear"]
tasks:
  - id: gsm8k_basic
  - id: gsm8k_multi_step
  - id: logical_reasoning
  - id: factual_qa
  - id: science_qa
  - id: commonsense_reasoning
  - id: tg_single_db
  - id: tg_sequential_2
  - id: tg_sequential_3
providers:
  - name: vllm_local
    model_id: Mistral-7B-Instruct-v0.3
execution:
  repetitions: 10
  cool_down_seconds: 30
  inter_task_cooldown_seconds: 90
  save_db: true
retry_policy:
  name: "aggressive"
  max_retries: 5
  retry_on_timeout: true
  retry_on_tool_error: true
  retry_on_api_error: true
  retry_on_wrong_answer: false
  backoff_seconds: 1.0
failure_injection:
  enabled: false
quality:
  enabled: false
