# config/experiment_configs/examples/example_inject_rate_limit.yaml
# =============================================================================
# EXAMPLE: rate_limit injection
# Verifies: tool_failure_events.failure_type=rate_limit, backoff retry fires,
#           FailureClassifier Layer 3 catches "429" in error_message.
# Task: tg_single_calc — tool dispatch path.
# Note: retry_policy uses backoff_seconds so rate_limit retry delay is measured.
# =============================================================================
study:
  name: "Example: rate_limit injection"
  experiment_type: "failure_injection"
  experiment_goal: "Verify rate_limit injection, backoff retry, and energy during backoff"
  workflow_modes: ["agentic"]

tasks:
  - id: tg_single_calc

providers:
  - name: vllm_remote
    model_id: Mistral-7B-Instruct-v0.3

execution:
  repetitions: 1
  cool_down_seconds: 5
  save_db: true

retry_policy:
  max_retries: 3
  retry_on_tool_error: true
  retry_on_api_error: true
  backoff_seconds: 1.0
  name: "default"
  backoff_seconds: 2.0
  retry_on_api_error: true

failure_injection:
  enabled: true
  mode: scenario
  scenario_id: "example_rate_limit_v1"
  scenarios:
    - type: rate_limit
      rate: 1.0
      location:
        phase: execution
        step_index: any
        tool_name: any
      max_injections: 1

quality:
  enabled: false
