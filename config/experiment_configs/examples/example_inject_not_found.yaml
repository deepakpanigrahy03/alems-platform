# config/experiment_configs/examples/example_inject_not_found.yaml
# =============================================================================
# EXAMPLE: not_found injection
# Verifies: ToolResult(success=False, 404_error) written,
#           goal_attempt.failure_type=not_found,
#           NO retry fired (default_retryable=0, strategy=skip).
# This is a non-retryable type — goal aborts after first failure.
# Energy measurement: single attempt energy only, no retry overhead.
# Task: tg_single_calc — tool dispatch path.
# =============================================================================
study:
  name: "Example: not_found injection"
  experiment_type: "failure_injection"
  experiment_goal: "Verify not_found injection is non-retryable — single attempt energy only"
  workflow_modes: ["agentic"]

tasks:
  - id: tg_single_calc

providers:
  - name: vllm_remote
    model_id: Mistral-7B-Instruct-v0.3

execution:
  repetitions: 1
  cool_down_seconds: 5
  save_db: true

retry_policy:
  max_retries: 3
  retry_on_tool_error: true
  retry_on_api_error: true
  backoff_seconds: 1.0
  name: "no_retry"

failure_injection:
  enabled: true
  mode: scenario
  scenario_id: "example_not_found_v1"
  scenarios:
    - type: not_found
      rate: 1.0
      location:
        phase: execution
        step_index: any
        tool_name: any
      max_injections: 1

quality:
  enabled: false
