# config/experiment_configs/examples/example_inject_json_parse.yaml
# =============================================================================
# EXAMPLE: json_parse injection
# Verifies: ToolResult(success=False, json_parse_error) written,
#           FailureClassifier catches "JSON parse failed" in error_message,
#           tool_failure_events.failure_type=json_parse, retry fires.
# Distinct from malformed_output: json_parse = completely unparseable response.
# Task: tg_single_calc — tool with JSON output.
# =============================================================================
study:
  name: "Example: json_parse injection"
  experiment_type: "failure_injection"
  experiment_goal: "Verify json_parse injection and classifier detection"
  workflow_modes: ["agentic"]

tasks:
  - id: tg_single_calc

providers:
  - name: vllm_remote
    model_id: Mistral-7B-Instruct-v0.3

execution:
  repetitions: 1
  cool_down_seconds: 5
  save_db: true

retry_policy:
  max_retries: 3
  retry_on_tool_error: true
  retry_on_api_error: true
  backoff_seconds: 1.0
  name: "default"

failure_injection:
  enabled: true
  mode: scenario
  scenario_id: "example_json_parse_v1"
  scenarios:
    - type: json_parse
      rate: 1.0
      location:
        phase: execution
        step_index: any
        tool_name: any
      max_injections: 1

quality:
  enabled: false
