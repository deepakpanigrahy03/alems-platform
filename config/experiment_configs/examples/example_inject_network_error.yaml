# config/experiment_configs/examples/example_inject_network_error.yaml
# =============================================================================
# EXAMPLE: network_error injection
# Verifies: raises ConnectionError in _dispatch_tool, FailureClassifier
#           maps network_error → api_error (communication domain),
#           goal_attempt.failure_type=api_error, retry fires.
# Note: network_error raises an exception — FailureClassifier exception path fires.
# Task: tg_single_calc — tool dispatch path needed.
# =============================================================================
study:
  name: "Example: network_error injection"
  experiment_type: "failure_injection"
  experiment_goal: "Verify network_error raises ConnectionError and classifier maps to api_error"
  workflow_modes: ["agentic"]

tasks:
  - id: tg_single_calc

providers:
  - name: vllm_remote
    model_id: Mistral-7B-Instruct-v0.3

execution:
  repetitions: 1
  cool_down_seconds: 5
  save_db: true

retry_policy:
  max_retries: 3
  retry_on_tool_error: true
  retry_on_api_error: true
  backoff_seconds: 1.0
  name: "default"

failure_injection:
  enabled: true
  mode: scenario
  scenario_id: "example_network_error_v1"
  scenarios:
    - type: network_error
      rate: 1.0
      location:
        phase: execution
        step_index: any
        tool_name: any
      max_injections: 1

quality:
  enabled: false
