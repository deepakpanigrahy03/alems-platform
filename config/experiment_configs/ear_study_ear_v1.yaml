# config/experiment_configs/ear_study_ear_v1.yaml
# =============================================================================
# EAR study: ear_v1 policy (calibrated balanced default)
# Policy: thresholds derived from failure_cost_profile heuristics
#   max_attempts = ceil(1/success_rate) capped at 5
#   cost_threshold = mean_cost * 2.0
#   success_prob_threshold = 0.10
# Prerequisite: run ear_study_flat_default.yaml first, then calibrate:
#   python scripts/etl/failure_cost_profile_etl.py --group <flat_group_id>
#   python core/retry/ear_calibrator.py --group <flat_group_id> --policy ear_v1
# =============================================================================
study:
  name: "EAR Study: ear_v1 policy"
  experiment_type: "failure_injection"
  experiment_goal: "Calibrated balanced EAR policy"
  workflow_modes: ["agentic"]

tasks:
  - id: gsm8k_basic
  - id: logical_reasoning
  - id: tg_sequential_2

providers:
  - name: vllm_remote
    model_id: Mistral-7B-Instruct-v0.3

execution:
  repetitions: 30
  cool_down_seconds: 5
  save_db: true

retry_policy:
  engine: ear
  ear_policy_name: ear_v1
  max_retries: 5
  backoff_seconds: 1.0

failure_injection:
  enabled: true
  mode: controlled_retry
  target_goal_pct: 0.40
  per_goal_attempts: 2

quality:
  enabled: false
