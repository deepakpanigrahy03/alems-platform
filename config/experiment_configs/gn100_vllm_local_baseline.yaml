study:
  name: "GN100 vLLM Local Baseline Study"
  experiment_type: "normal"
  experiment_goal: "Paper2 GPU baseline — CPU+GPU energy per goal, vllm_local, GN100 GB10"
  experiment_notes: "paper2_gn100 group. GPU via DCGM field 156. SPBM pkg. 30 reps. Start with Mistral-7B."
  workflow_modes: ["linear", "agentic"]
  group_id: "paper2_gn100"
tasks:
  - id: gsm8k_basic
  - id: gsm8k_multi_step
  - id: logical_reasoning
  - id: factual_qa
  - id: science_qa
  - id: commonsense_reasoning
  - id: tg_single_db
  - id: tg_sequential_2
  - id: tg_sequential_3
providers:
  - name: vllm_local
    model_id: Mistral-7B-Instruct-v0.3
execution:
  repetitions: 30
  cool_down_seconds: 30
  inter_task_cooldown_seconds: 90
  save_db: true
retry_policy:
  name: "no_retry"
  max_retries: 0
  retry_on_timeout: false
  retry_on_tool_error: false
  retry_on_api_error: false
  retry_on_wrong_answer: false
  backoff_seconds: 0.0
failure_injection:
  enabled: false
quality:
  enabled: false
