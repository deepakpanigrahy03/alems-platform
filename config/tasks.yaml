# =====================================================
# MULTI-TOOL TASKS — exercises tool orchestration
# =====================================================
 
  - id: db_query_analysis
    category: multi_tool
    name: "Database Query and Analysis"
    description: "Query experiment database and analyze results"
    level: 2
    tool_calls: 2
    tool_sequence: [database_query, database_query]
    max_tool_calls: 4
    prompt: |
      Use the database query tool to find the average energy consumption
      for linear vs agentic workflows. Then query again to find the top 3
      most energy-intensive tasks. Summarize your findings.
    expected_answer: "comparison of linear vs agentic energy with specific numbers"
 
  - id: file_analysis_pipeline
    category: multi_tool
    name: "File Analysis Pipeline"
    description: "Read file, process data, write summary"
    level: 2
    tool_calls: 2
    tool_sequence: [file_processor, file_processor]
    max_tool_calls: 4
    prompt: |
      Read the experiment_summary.txt file, identify the key metrics,
      then write a processed_summary.txt with only the energy-related findings.
    expected_answer: "file successfully read and processed summary written"
 
  - id: multi_source_research
    category: multi_tool
    name: "Multi-Source Research Task"
    description: "Query multiple sources and synthesize findings"
    level: 3
    tool_calls: 3
    tool_sequence: [database_query, api_query, file_processor]
    max_tool_calls: 6
    prompt: |
      First query the database for recent experiment results.
      Then fetch the latest metrics from the API endpoint.
      Finally save a combined report to findings.txt.
      Synthesize all findings into a coherent summary.
    expected_answer: "coherent synthesis from multiple sources with saved report"
 
# =====================================================
# PLANNING TASKS
# =====================================================
 
  - id: experiment_planning
    category: planning
    name: "Experiment Planning"
    description: "Plan a multi-step experiment using available data"
    level: 3
    tool_calls: 2
    tool_sequence: [database_query, file_processor]
    max_tool_calls: 4
    prompt: |
      Query the database to understand current experiment coverage.
      Based on the gaps you find, create a detailed experiment plan
      and save it to experiment_plan.txt. Include task types, providers,
      and expected repetitions needed for statistical significance.
    expected_answer: "structured experiment plan saved to file with clear rationale"
 
  - id: resource_optimization_plan
    category: planning
    name: "Resource Optimization Planning"
    description: "Analyze resource usage and create optimization plan"
    level: 3
    tool_calls: 2
    tool_sequence: [database_query, file_processor]
    max_tool_calls: 4
    prompt: |
      Query the database for runs with highest energy consumption.
      Identify patterns and create an optimization strategy.
      Save your recommendations to optimization_plan.txt.
    expected_answer: "data-driven optimization plan with specific recommendations"
 
# =====================================================
# DATA ANALYSIS TASKS
# =====================================================
 
  - id: energy_trend_analysis
    category: data_analysis
    name: "Energy Trend Analysis"
    description: "Analyze energy consumption trends across experiments"
    level: 2
    tool_calls: 2
    tool_sequence: [database_query, file_processor]
    max_tool_calls: 4
    prompt: |
