server:
  host: 0.0.0.0
  port: 8501
  debug: false
database:
  # Choose engine: "sqlite" or "postgresql"
  engine: "sqlite"
  
  # SQLite settings (used when engine = "sqlite")
  sqlite:
    db_name: "experiments.db"             # DB filename, path resolved by path_loader
    journal_mode: "WAL"                    # Better concurrency
    journal_mode: "WAL"                    # Better concurrency
    timeout: 30                             # Connection timeout (seconds)
    detect_types: 1                         # Enable type detection
  
  # PostgreSQL settings (used when engine = "postgresql")
  postgresql:
    host: "localhost"
    port: 5432
    database: "alems"
    user: "alems_user" 
    password: "${DB_PASSWORD}"              # Use environment variable
    pool_size: 10
    max_overflow: 20
    pool_timeout: 30
  
  # Common settings for all engines
  pool_pre_ping: true                        # Verify connections before use
  backup_enabled: true                        # Keep your existing setting
  backup_interval_hours: 24                    # Keep your existing setting
paths:
  log: logs/a-lems.log
  data: data/
  exports: exports/
  temp: tmp/
timeouts:
  execution_seconds: 300
  api_seconds: 30
  measurement_seconds: 600
  database_seconds: 10
experiment:
  default_iterations: 10
  cool_down_seconds: 30
  parallel_execution: true
  max_concurrent_tasks: 2
  save_raw_data: true
  # ====================================================================
  # NEW Baseline measurement control
  # ====================================================================
  baseline:
    force_remeasure: false           # Set to false during development
    duration_seconds: 30
    num_samples: 3
    pre_wait_seconds: 10
    # cache_file removed: the cache is store scoped (<store folder>/baselines/).
    measure_gpu: true
  # true for production, false to use cache  
  
# ===== NEW: MSR measurement settings =====
msr:
  # Read APERF/MPERF for actual frequency? (adds slight overhead)
  enable_aperf_mperf: false
  # Number of samples for wake‑up latency measurement (used by baseline script)
  wakeup_latency_iterations: 500
  # Which CPU cores to test (for future multi‑core measurement)
  measure_cores: [0]
  # Whether to measure cores in parallel (future)
  parallel_measurement: false  
logging:
  level: INFO
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  rotation: 1 day
  retention: 30 days
alerts:
  temperature_threshold_celsius: 85
  power_threshold_watts: 50
  memory_threshold_mb: 3500
webui:
  enabled: true
  servers:
    - name: "live_view"
      type: "streamlit"
      url: "http://localhost:8501"
      api_endpoint: "/api/update"
      active: true
    - name: "dashboard"
      type: "grafana"
      url: "http://localhost:3000"
      api_endpoint: "/api/live"
      active: false
    - name: "custom"
      type: "generic"
      url: "http://localhost:8080"
      api_endpoint: "/metrics"
      active: false
  sampling_rate_hz: 10
  timeout_ms: 1  
  

# Extension system (35D) — research extensions active on this machine.
# Remove this section entirely to return to legacy mode (all extensions run as before).
extensions:
  active: [tool_selection, energy_validation, thermal_exposure]

plugins:
  synthetic:
    enabled: false
    mode: constant
    package_uj: 9999999
  # NVTX phase markers for NVIDIA profilers (alems-plugin-nvtx). Off: enable per profiled
  # run with ALEMS_NVTX_ENABLED=1; the domain can be changed with ALEMS_NVTX_DOMAIN.
  nvtx:
    enabled: false
    domain: alems

thermal_exposure:
  machine_profile: auto          # profile from platform class (config/machine_profiles/index.yaml)

# Phase attribution v3 (chunk 45): signed residual between run attribution and
# phase estimates. Integrity warns above this share of attributed energy.
attribution:
  phase_residual_warn_fraction: 0.10

# Run counter energy vs package samples over [t0, t1], coverage corrected
# (claude/FINDING_45_prod_energy_consistency.md). Integrity fails outside the band.
energy_consistency:
  ratio_low: 0.8
  ratio_high: 1.25
  min_sample_coverage_pct: 90
  tick_min_task_s: 1.0

# Run the integrity validator after every run_experiment call (chunk 45).
validation:
  auto_integrity_after_run: true

# X1 update rate script (scripts/x1_update_rates.py). CSV only, attended runs.
x1_update_rates:
  step_s: 60                 # sampling time per step
  repeats: 3
  order: [IDLE, LOAD]        # per repeat: I L I L I L
  settle_s: 60               # rest between steps (GPU cools before the next LOAD)
  hwmon_poll_ms: 5           # SPBM read period, well below the 100 ms counter update
  gap_threshold_ms: 300      # arrival interval above this counts as a gap
  hwmon_unresolved_factor: 1.5  # change p50 within this x poll: cadence not resolvable
  server_process_patterns: ["vllm serve", "llama-server", "sglang"]
  dcgm:
    field_id: 156
    update_ms: 10            # watch period requested from the DCGM host engine
    poll_ms: 50              # how often the script collects recorded values
    max_keep_age_s: 30
    resolution_note_ms: 100  # DCGM arrival p50 at or above this: cadence not resolvable below it
    bindings_paths:
      - /usr/share/datacenter-gpu-manager-4/bindings/python3
      - /usr/local/dcgm/bindings/python3
  load:
    python: /opt/ai-stack/envs/vllm-env/bin/python3   # torch with CUDA lives here
    matrix_n: 2048
    dtype: bfloat16
    duty: 0.15
    period_ms: 100
    warmup_s: 5
    seed: 45
  thermal:
    max_start_temp_c: 70     # a LOAD step is refused above this
    abort_temp_c: 80         # any step is aborted at or above this
    check_interval_s: 1.0
  check:
    pkg_change_p50_ms_low: 80
    pkg_change_p50_ms_high: 120

# Phase ownership bounds (scripts/ownership_bounds.py). CSV only, read only.
ownership_bounds:
  support_widen_ms: 100     # counter update period: an increment may have accrued this much before its poll interval
  min_sample_cover: 0.5     # phase must lie at least this much inside the sampled span, else noted (clock basis check)
  domains: {PACKAGE: 1, CPU_P: 5, CPU_E: 6, GPU: 7, GPU_DCGM: dcgm}   # dcgm: read from gpu_samples
