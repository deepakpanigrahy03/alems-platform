# config/methodology_docs.yaml
# =============================================================================
# METHODOLOGY DOCS MAP — single source of truth for every seeded method
# =============================================================================
# method_id -> doc file (relative to docs_base), section heading text, method_anchor.
# seed_methodology.py takes each method's description from this doc section;
# this map overrides any doc or section written inside the seed entries.
# section must match a heading in the doc (validate_methodology_refs.py checks).
# method_anchor is permanent (MPC-5): the 18 anchors already in the DB keep
# their values; all others are assigned here for the first time (B22, Nov 9).
# =============================================================================

