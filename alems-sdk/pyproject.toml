[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alems-sdk"
version = "0.9.0"
description = "A-LEMS SDK: stable facade and conformance kits for plugin authors"
requires-python = ">=3.9"
dependencies = ["packaging>=21"]

[tool.setuptools.packages.find]
where = ["src"]
