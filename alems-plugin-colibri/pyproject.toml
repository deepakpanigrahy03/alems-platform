[project]
name = "alems-plugin-colibri"
version = "0.1.0"
description = "Colibri MoE inference engine telemetry adapter for A-LEMS"
requires-python = ">=3.9"
dependencies = [
    "alems-platform>=1.0,<2.0",
    "requests>=2.31.0",
]
# Does NOT install Colibrì.
# Build from source: https://github.com/JustVugg/colibri
# Launch with: ./coli serve --model /path/to/model
#
# Telemetry available: queue counters via GET /health.
# Expert tier metrics (VRAM/RAM/NVMe placement) will be added when
# Colibrì exposes a stable /v1/stats or /metrics JSON endpoint.

[project.entry-points."alems.engines.serving"]
colibri = "alems_plugin_colibri.adapter:ColibriAdapter"

# 8.6-B5: models fragment — declares colibri_remote provider defaults.
# models_loader._load_fragments() discovers this at startup.
# models.yaml always wins on collision.
# Status: deferred (no supported model on GN100). Fragment activates
# automatically once a supported model (GLM-5.2, Kimi K3) is downloaded.
[project.entry-points."alems.models.fragments"]
colibri = "alems_plugin_colibri.models_fragment:fragment"

# 8.6-B5: preflight check — config-driven, base_url already resolved from ~/.alemsrc
[project.entry-points."alems.preflight.checks"]
colibri_remote = "alems_plugin_colibri.preflight:check"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
