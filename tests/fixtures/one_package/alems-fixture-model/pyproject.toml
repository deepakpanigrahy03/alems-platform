[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alems-fixture-model"
version = "0.1.0"
description = "One-package-test fixture: model fragment"
requires-python = ">=3.9"
dependencies = ["alems-sdk"]

[tool.setuptools.packages.find]
where = ["."]
include = ["fixture_model*"]

[project.entry-points."alems.models.fragments"]
fixture_model = "fixture_model.fragment:FixtureModelFragment"
