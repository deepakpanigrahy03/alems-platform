name: Tier A — Logic Tests

on:
  pull_request:
    branches: [integration]

jobs:
  tier-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r vendor/alems-test-framework/requirements.txt

      - name: Smoke test
        run: python vendor/alems-test-framework/checks/tier_a/smoke_imports.py

      - name: Run Tier A
        run: pytest vendor/alems-test-framework/checks/tier_a/ -v --tb=short
