[project]
name = "alems-plugin-llama-cpp"
version = "0.1.0"
description = "llama.cpp server telemetry adapter for A-LEMS"
requires-python = ">=3.9"
dependencies = [
    "alems-platform>=1.0,<2.0",
    "requests>=2.31.0",
]
# Does NOT install llama.cpp binary.
# Build llama.cpp separately: https://github.com/ggml-org/llama.cpp
# Launch with: llama-server --metrics --port 8080 -m <model.gguf>

[project.entry-points."alems.engines.serving"]
llama_cpp = "alems_plugin_llama_cpp.adapter:LlamaCppAdapter"

# 8.6-B5: models fragment — declares llamacpp_remote provider defaults.
# models_loader._load_fragments() discovers this at startup.
# models.yaml always wins on collision.
# NOTE: after B5 is pip-installed, remove the manually added llamacpp_remote
# block from models.yaml — the fragment becomes the authoritative source.
[project.entry-points."alems.models.fragments"]
llama_cpp = "alems_plugin_llama_cpp.models_fragment:fragment"

# 8.6-B5: preflight check — config-driven, base_url already resolved from ~/.alemsrc
[project.entry-points."alems.preflight.checks"]
llamacpp_remote = "alems_plugin_llama_cpp.preflight:check"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
